[tool.poetry]
name = "course-1"
version = "0.1.0"
description = ""
authors = ["Alexandr Ponomarev <alexandr-ponomarev-it@ya.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
black = "^25.1.0"
pandas = "^2.2.3"
python-dotenv = "^1.0.1"
isort = "^6.0.0"
flake8 = "^7.1.1"
mypy = "^1.15.0"
requests = "^2.32.3"
pytest = "^8.3.4"
requests-mock = "^1.12.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
# Максимальная длина строки
line-length = 119
exclude = ".git"

[tool.isort]
# максимальная длина строки
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = '.venv'
